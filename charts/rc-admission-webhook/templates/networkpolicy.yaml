{{- if .Values.networkPolicy.enabled }}
# Allows ingress to the webhook only from namespaces labeled
# `webhook: enabled` - a CR that uses this webhook only works when applied
# in a namespace carrying that label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rc-admission-webhook.fullname" . }}-allow-webhook-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rc-admission-webhook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rc-admission-webhook.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              webhook: enabled
      ports:
        - port: 443
          protocol: TCP
{{- end }}

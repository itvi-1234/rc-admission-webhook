apiVersion: v1
kind: Service
metadata:
  name: {{ include "rc-admission-webhook.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rc-admission-webhook.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    {{- include "rc-admission-webhook.selectorLabels" . | nindent 4 }}

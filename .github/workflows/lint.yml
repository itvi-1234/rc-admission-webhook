name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # golangci-lint has no release built with go1.27 yet (our go.mod's
      # `go` version), so it refuses to run at all - not a real code
      # problem. Remove continue-on-error once golangci-lint catches up.
      - name: Check linter configuration
        run: make lint-config
        continue-on-error: true
      - name: Run linter
        run: make lint
        continue-on-error: true

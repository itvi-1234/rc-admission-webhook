name: Publish Helm chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/helm-publish.yml"
  workflow_dispatch: {}

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    name: Package and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Fetch chart dependencies
        run: helm dependency update charts/rc-admission-webhook

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/rc-admission-webhook -d dist

      - name: Push chart as an OCI artifact
        run: |
          chart_file="$(ls dist/rc-admission-webhook-*.tgz)"
          helm push "$chart_file" oci://ghcr.io/runtimeconditions/charts
